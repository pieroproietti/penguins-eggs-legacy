# ========================================================
# NOME: publish-penguins-gui
# DESCRIZIONE: Scarica i pacchetti di penguins-gui da GitHub Releases,
#              li estrae e pubblica i pacchetti nella repository VPS.
# ========================================================
name: publish-penguins-gui

on:
  workflow_dispatch:
    inputs:
      penguins_gui_version:
        description: "Tag release (lascia vuoto per l'ultima release)"
        required: false
        default: ''
        type: string

jobs:
  # ========================================================
  # 1.0 JOB DI PUBBLICAZIONE DEBIAN / DEVUAN / UBUNTU
  # runs-on: self-hosted (runner vps) CON CONTAINER
  # ========================================================
  publish-penguins-gui-debian:
    runs-on: self-hosted
    container:
      image: debian:13
      volumes:
        - /var/www/html/repos/deb:/mnt/deb-repo # HostPath:ContainerPath
    
    steps:
      - name: 1. Install Dependencies
        run: |
          apt-get update
          apt-get install -y apt-utils gnupg dpkg dpkg-dev curl unzip
          # Installiamo GitHub CLI (gh)
          curl -sL https://github.com/cli/cli/releases/download/v2.47.0/gh_2.47.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin --strip-components=2 gh_2.47.0_linux_amd64/bin/gh

      - name: 2. Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${{ secrets.GPG_SIGNING_KEY }}" | gpg --import --batch
          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o /dev/null -s /dev/null

      - name: 3. Fetch, Extract & Debug penguins-gui Debian packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.penguins_gui_version }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo pieroproietti/penguins-gui --json tagName --jq .tagName)
          fi
          echo "Scaricamento archivi Debian versione $TARGET_TAG..."
          mkdir -p /tmp/penguins-gui
          
          # Scarica sia eventuali archivi zip (es. artifact da GitHub Actions) sia pacchetti .deb diretti
          gh release download "$TARGET_TAG" --repo pieroproietti/penguins-gui --pattern "penguins-gui-debian*.zip" --dir /tmp/penguins-gui || true
          gh release download "$TARGET_TAG" --repo pieroproietti/penguins-gui --pattern "*.deb" --dir /tmp/penguins-gui || true
          
          echo "--- INVENTARIO FILE SCARICATI ---"
          ls -lh /tmp/penguins-gui/
          
          echo "--- ESTRAZIONE PACCHETTI (se presenti file zip) ---"
          for zipfile in /tmp/penguins-gui/penguins-gui-debian*.zip; do
            [ -f "$zipfile" ] || continue
            echo "Estraendo: $zipfile"
            unzip -o "$zipfile" -d /tmp/penguins-gui/
          done
          
          echo "--- INVENTARIO .DEB ESTRATTI ---"
          ls -lh /tmp/penguins-gui/*.deb
          
          echo "--- CONTROLLO ARCHITETTURA INTERNA DEI DEB ---"
          for deb in /tmp/penguins-gui/*.deb; do
            echo "File: $deb"
            dpkg-deb -I "$deb" | grep "Architecture:"
          done
          
          echo "--- COPIA NEL POOL ---"
          cp /tmp/penguins-gui/*.deb /mnt/deb-repo/pool/main/
          
      - name: 4. Update Debian Repo (NO Pruning)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: /mnt/deb-repo
        run: |
          set -e
          echo "--- DEBIAN: Genero file Packages per le architetture ---"
          
          # Creiamo le cartelle se non esistono (fondamentale per le nuove architetture)
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-arm64
          mkdir -p dists/stable/main/binary-riscv64
          
          # Indicizzazione AMD64
          dpkg-scanpackages -a amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          
          # Indicizzazione ARM64
          dpkg-scanpackages -a arm64 pool/main > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz
          
          # Indicizzazione RISCV64
          dpkg-scanpackages -a riscv64 pool/main > dists/stable/main/binary-riscv64/Packages
          gzip -9c dists/stable/main/binary-riscv64/Packages > dists/stable/main/binary-riscv64/Packages.gz
          
          echo "--- DEBIAN: Genero file Release ---"
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Penguins-Eggs" \
            -o APT::FTPArchive::Release::Label="Penguins-Eggs" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64 riscv64 i386" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release
            
          echo "--- DEBIAN: Firmo file Release (creo InRelease) ---"
          gpg --default-key "$GPG_KEY_ID" \
              --clearsign \
              -o dists/stable/InRelease \
              --batch --yes --passphrase "$GPG_PASSPHRASE" \
              dists/stable/Release

  # ========================================================
  # 2.0 JOB DI PUBBLICAZIONE ARCH LINUX
  # runs-on: self-hosted (runner vps) CON CONTAINER
  # ========================================================
  publish-penguins-gui-arch:
    runs-on: self-hosted
    container:
      image: archlinux
      volumes:
        - /var/www/html/repos/arch:/mnt/arch-repo # HostPath:ContainerPath
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed gnupg github-cli unzip

      - name: 2. Fetch & Extract penguins-gui Arch packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.penguins_gui_version }}
        run: |
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo pieroproietti/penguins-gui --json tagName --jq .tagName)
          fi
          echo "Scaricamento pacchetti Arch versione $TARGET_TAG..."
          mkdir -p /tmp/penguins-gui-arch
          gh release download "$TARGET_TAG" --repo pieroproietti/penguins-gui \
            --pattern "penguins-gui-arch*.zip" \
            --pattern "penguins-gui-*.pkg.tar.zst" \
            --dir /tmp/penguins-gui-arch

          for zipfile in /tmp/penguins-gui-arch/penguins-gui-arch*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -o "$zipfile" -d /tmp/penguins-gui-arch/
          done

          if ! find /tmp/penguins-gui-arch -type f -name 'penguins-gui-*.pkg.tar.zst' ! -name '*-manjaro.pkg.tar.zst' -print -quit | grep -q .; then
            echo "Errore: nessun pacchetto Arch penguins-gui trovato nella release $TARGET_TAG" >&2
            exit 1
          fi

      - name: 3. Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o /dev/null -s /dev/null

      - name: 4. Sign, Publish & Update Arch Repo (NO Pruning)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: /mnt/arch-repo
        run: |
          mapfile -d '' packages < <(find /tmp/penguins-gui-arch -type f -name 'penguins-gui-*.pkg.tar.zst' ! -name '*-manjaro.pkg.tar.zst' -print0)
          published=()
          for package in "${packages[@]}"; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --local-user "$GPG_KEY_ID" --detach-sign "$package"
            cp "$package" "$package.sig" /mnt/arch-repo/
            published+=("/mnt/arch-repo/$(basename "$package")")
          done
          # Aggiorna solo i pacchetti scaricati, conservando le altre voci del database.
          repo-add --sign --key "$GPG_KEY_ID" penguins-eggs.db.tar.gz "${published[@]}"

  # ========================================================
  # 3.0 JOB DI PUBBLICAZIONE MANJARO
  # runs-on: self-hosted (runner vps) CON CONTAINER
  # ========================================================
  publish-penguins-gui-manjaro:
    runs-on: self-hosted
    container:
      image: archlinux
      volumes:
        - /var/www/html/repos/manjaro:/mnt/manjaro-repo # HostPath:ContainerPath
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed gnupg github-cli unzip

      - name: 2. Fetch & Extract penguins-gui Manjaro packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.penguins_gui_version }}
        run: |
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo pieroproietti/penguins-gui --json tagName --jq .tagName)
          fi
          echo "Scaricamento pacchetti Manjaro versione $TARGET_TAG..."
          mkdir -p /tmp/penguins-gui-manjaro
          gh release download "$TARGET_TAG" --repo pieroproietti/penguins-gui \
            --pattern "penguins-gui-manjaro*.zip" \
            --pattern "penguins-gui-*-manjaro.pkg.tar.zst" \
            --dir /tmp/penguins-gui-manjaro

          for zipfile in /tmp/penguins-gui-manjaro/penguins-gui-manjaro*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -o "$zipfile" -d /tmp/penguins-gui-manjaro/
          done

          if ! find /tmp/penguins-gui-manjaro -type f -name 'penguins-gui-*-manjaro.pkg.tar.zst' -print -quit | grep -q .; then
            echo "Errore: nessun pacchetto Manjaro penguins-gui trovato nella release $TARGET_TAG" >&2
            exit 1
          fi

      - name: 3. Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o /dev/null -s /dev/null

      - name: 4. Sign, Publish & Update Manjaro Repo (NO Pruning)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: /mnt/manjaro-repo
        run: |
          mapfile -d '' packages < <(find /tmp/penguins-gui-manjaro -type f -name 'penguins-gui-*-manjaro.pkg.tar.zst' -print0)
          published=()
          for package in "${packages[@]}"; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --local-user "$GPG_KEY_ID" --detach-sign "$package"
            cp "$package" "$package.sig" /mnt/manjaro-repo/
            published+=("/mnt/manjaro-repo/$(basename "$package")")
          done
          # Aggiorna solo i pacchetti scaricati, conservando le altre voci del database.
          repo-add --sign --key "$GPG_KEY_ID" penguins-eggs.db.tar.gz "${published[@]}"

  # ========================================================
  # 4.0 JOB DI PUBBLICAZIONE FEDORA
  # runs-on: self-hosted (runner vps) CON CONTAINER
  # ========================================================
  publish-penguins-gui-fedora:
    runs-on: self-hosted
    container:
      image: archlinux
      volumes:
        - /var/www/html/repos/rpm/fedora/42:/mnt/fedora-repo # HostPath:ContainerPath
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed createrepo_c github-cli unzip

      - name: 2. Fetch & Extract penguins-gui Fedora packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.penguins_gui_version }}
        run: |
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo pieroproietti/penguins-gui --json tagName --jq .tagName)
          fi
          echo "Scaricamento pacchetti Fedora versione $TARGET_TAG..."
          mkdir -p /tmp/penguins-gui-fedora
          gh release download "$TARGET_TAG" --repo pieroproietti/penguins-gui \
            --pattern "penguins-gui-fedora*.zip" \
            --pattern "penguins-gui-*.rpm" \
            --dir /tmp/penguins-gui-fedora

          for zipfile in /tmp/penguins-gui-fedora/penguins-gui-fedora*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -o "$zipfile" -d /tmp/penguins-gui-fedora/
          done

          if ! find /tmp/penguins-gui-fedora -type f -name 'penguins-gui-*.x86_64.rpm' ! -name '*.opensuse.*.rpm' -print -quit | grep -q .; then
            echo "Errore: nessun pacchetto Fedora x86_64 penguins-gui trovato nella release $TARGET_TAG" >&2
            exit 1
          fi

      - name: 3. Publish & Update Fedora Repo (WITH Pruning)
        working-directory: /mnt/fedora-repo
        run: |
          mkdir -p /mnt/fedora-repo/x86_64
          mapfile -d '' packages < <(find /tmp/penguins-gui-fedora -type f -name 'penguins-gui-*.x86_64.rpm' ! -name '*.opensuse.*.rpm' -print0)
          cp "${packages[@]}" /mnt/fedora-repo/x86_64/
          cd /mnt/fedora-repo/x86_64
          ls penguins-gui-[0-9]*.rpm 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
          rm -rf /mnt/fedora-repo/x86_64/repodata
          createrepo_c /mnt/fedora-repo/x86_64
          rm -rf /mnt/fedora-repo/repodata
          createrepo_c /mnt/fedora-repo

  # ========================================================
  # 5.0 JOB DI PUBBLICAZIONE OPENSUSE
  # runs-on: self-hosted (runner vps) CON CONTAINER
  # ========================================================
  publish-penguins-gui-opensuse:
    runs-on: self-hosted
    container:
      image: archlinux
      volumes:
        - /var/www/html/repos/rpm/opensuse/leap:/mnt/opensuse-repo # HostPath:ContainerPath
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed createrepo_c github-cli unzip

      - name: 2. Fetch & Extract penguins-gui openSUSE packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.penguins_gui_version }}
        run: |
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo pieroproietti/penguins-gui --json tagName --jq .tagName)
          fi
          echo "Scaricamento pacchetti openSUSE versione $TARGET_TAG..."
          mkdir -p /tmp/penguins-gui-opensuse
          gh release download "$TARGET_TAG" --repo pieroproietti/penguins-gui \
            --pattern "penguins-gui-opensuse*.zip" \
            --pattern "penguins-gui-*.opensuse.x86_64.rpm" \
            --dir /tmp/penguins-gui-opensuse

          for zipfile in /tmp/penguins-gui-opensuse/penguins-gui-opensuse*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -o "$zipfile" -d /tmp/penguins-gui-opensuse/
          done

          if ! find /tmp/penguins-gui-opensuse -type f -name 'penguins-gui-*.opensuse.x86_64.rpm' -print -quit | grep -q .; then
            echo "Errore: nessun pacchetto openSUSE x86_64 penguins-gui trovato nella release $TARGET_TAG" >&2
            exit 1
          fi

      - name: 3. Publish & Update openSUSE Repo (WITH Pruning)
        working-directory: /mnt/opensuse-repo
        run: |
          mkdir -p /mnt/opensuse-repo/x86_64
          mapfile -d '' packages < <(find /tmp/penguins-gui-opensuse -type f -name 'penguins-gui-*.opensuse.x86_64.rpm' -print0)
          cp "${packages[@]}" /mnt/opensuse-repo/x86_64/
          cd /mnt/opensuse-repo/x86_64
          ls penguins-gui-[0-9]*.rpm 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
          rm -rf /mnt/opensuse-repo/x86_64/repodata
          createrepo_c /mnt/opensuse-repo/x86_64
          rm -rf /mnt/opensuse-repo/repodata
          createrepo_c /mnt/opensuse-repo

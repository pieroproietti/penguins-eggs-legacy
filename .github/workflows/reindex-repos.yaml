# ========================================================
# NOME: reindex-repos
# DESCRIZIONE: Re-indicizza manualmente tutti i repository
#              sulla VPS e pulisce i pacchetti vecchi.
# ========================================================
name: reindex-repos

on:
  workflow_dispatch:

jobs:
  # ========================================================
  # 1.0 JOB REINDEX DEBIAN
  # ========================================================
  reindex-debian:
    runs-on: self-hosted
    container:
      image: debian:13
      volumes:
        - /var/www/html/repos:/mnt/repos
    
    steps:
      - name: 1. Install Dependencies
        run: |
          apt-get update
          apt-get install -y apt-utils gnupg dpkg-dev

      - name: 2. Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | gpg --import --batch
          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o /dev/null -s /dev/null

      - name: 3. Reindex Debian
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: /mnt/repos/deb
        run: |
          set -e
          echo "--- DEBIAN: Indexing ---"
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-arm64
          mkdir -p dists/stable/main/binary-riscv64
          mkdir -p dists/stable/main/binary-i386

          # Compila gli indici per tutte le architetture
          dpkg-scanpackages -a amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          dpkg-scanpackages -a arm64 pool/main > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz
          dpkg-scanpackages -a riscv64 pool/main > dists/stable/main/binary-riscv64/Packages
          gzip -9c dists/stable/main/binary-riscv64/Packages > dists/stable/main/binary-riscv64/Packages.gz
          dpkg-scanpackages -a i386 pool/main > dists/stable/main/binary-i386/Packages
          gzip -9c dists/stable/main/binary-i386/Packages > dists/stable/main/binary-i386/Packages.gz
          
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Penguins-Eggs" \
            -o APT::FTPArchive::Release::Label="Penguins-Eggs" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64 riscv64 i386" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release
            
          gpg --default-key "$GPG_KEY_ID" \
              --clearsign \
              -o dists/stable/InRelease \
              --batch --yes --passphrase "$GPG_PASSPHRASE" \
              dists/stable/Release

  # ========================================================
  # 2.0 JOB REINDEX ALTRE DISTRO (Arch, Manjaro, Alpine, RPM)
  # ========================================================
  reindex-others:
    runs-on: self-hosted 
    container:
      image: archlinux
      volumes:
        - /var/www/html/repos:/mnt/repos
    
    steps:
      - name: 1. Install Dependencies
        run: |
          pacman-key --init && pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm pacman-contrib gnupg createrepo_c apk-tools

      - name: 2. Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | gpg --import --batch
          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o /dev/null -s /dev/null

      - name: 3. Reindex Arch (WITH Pruning)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        working-directory: /mnt/repos/arch
        run: |
          set -ex
          echo '--- ARCH: Cleaning old packages ---'
          PKG_BASES=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -exec basename {} \; | sed -E 's/-[0-9]+.*//' | sort -u)
          for base in $PKG_BASES; do
            ls ${base}-[0-9]*.pkg.tar.zst 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
            ls ${base}-[0-9]*.pkg.tar.zst.sig 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
          done
          
          echo '--- ARCH: Indexing remaining packages ---'
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            rm -f penguins-eggs.db.tar.gz penguins-eggs.files.tar.gz
            repo-add --sign --key "$GPG_KEY_ID" penguins-eggs.db.tar.gz *.pkg.tar.zst
          fi

      - name: 4. Reindex Manjaro (WITH Pruning)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        working-directory: /mnt/repos/manjaro
        run: |
          set -ex
          echo '--- MANJARO: Cleaning old packages ---'
          PKG_BASES=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -exec basename {} \; | sed -E 's/-[0-9]+.*//' | sort -u)
          for base in $PKG_BASES; do
            ls ${base}-[0-9]*.pkg.tar.zst 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
            ls ${base}-[0-9]*.pkg.tar.zst.sig 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
          done
          
          echo '--- MANJARO: Indexing remaining packages ---'
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            rm -f penguins-eggs.db.tar.gz penguins-eggs.files.tar.gz
            repo-add --sign --key "$GPG_KEY_ID" penguins-eggs.db.tar.gz *.pkg.tar.zst
          fi

      - name: 5. Reindex RPM (WITH Pruning)
        run: |
          set -ex
          echo "--- RPM: Cleaning & Re-indexing ---"
          for repo_dir in /mnt/repos/rpm/fedora/42 /mnt/repos/rpm/opensuse/leap /mnt/repos/rpm/el9; do
            [ -d "$repo_dir/x86_64" ] || continue
            echo "--- RPM: Elaborazione $repo_dir ---"
            cd "$repo_dir/x86_64"

            # Appiattisce eventuali sottocartelle x86_64/x86_64/ create da vecchi artifact
            if [ -d "x86_64" ]; then
              find x86_64 -type f -name '*.rpm' -exec mv -f -t . {} +
              rm -rf x86_64
            fi

            # Pruning dei vecchi pacchetti .rpm (mantiene solo l'ultima versione per ogni pacchetto)
            PKG_BASES=$(find . -maxdepth 1 -name '*.rpm' -exec basename {} \; | sed -E 's/-[0-9]+.*//' | sort -u)
            for base in $PKG_BASES; do
              ls ${base}-[0-9]*.rpm 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
            done

            # Rigenera repodata sia in x86_64/ (retrocompatibilità) sia nella radice della repo (baseurl ufficiale)
            rm -rf "$repo_dir/x86_64/repodata"
            createrepo_c "$repo_dir/x86_64"
            rm -rf "$repo_dir/repodata"
            createrepo_c "$repo_dir"
          done

      - name: 6. Reindex Alpine (WITH Pruning)
        env:
          ALPINE_SIGNING_KEY_PUB: ${{ secrets.ALPINE_SIGNING_KEY_PUB }}
        working-directory: /mnt/repos/alpine
        run: |
          set -ex
          echo "$ALPINE_SIGNING_KEY_PUB" > piero.proietti@gmail.com-66b8815d.rsa.pub
          
          # Esegue l'aggiornamento per OGNI architettura rilevata dinamicamente
          for arch_dir in /mnt/repos/alpine/*/; do
            [ -d "$arch_dir" ] || continue
            ARCH=$(basename "$arch_dir")
            echo "--- ALPINE: Elaborazione architettura $ARCH ---"
            
            cd "/mnt/repos/alpine/$ARCH"
            
            echo '--- ALPINE: Cleaning old packages ---'
            PKG_BASES=$(find . -maxdepth 1 -name '*.apk' -exec basename {} \; | sed -E 's/-[0-9]+.*//' | sort -u)
            for base in $PKG_BASES; do
              ls ${base}-[0-9]*.apk 2>/dev/null | sort -V | head -n -1 | xargs -r rm -vf
            done
            
            echo '--- ALPINE: Indexing remaining packages ---'
            rm -f APKINDEX.tar.gz
            if ls *.apk 1> /dev/null 2>&1; then
              apk index -o APKINDEX.tar.gz *.apk --allow-untrusted
            else
              echo "⚠️ Nessun pacchetto trovato in $ARCH, salto indicizzazione."
            fi
          done
          